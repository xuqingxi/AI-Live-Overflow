<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
.pet { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; user-select: none; position: relative; }
.pet svg { width: 100%; height: 100%; overflow: visible; }
.bubble { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 999; }
.bubble.show { opacity: 1; }
.bubble.pink { background: #ff69b4; color: #fff; }
.bubble.red { background: #ff4444; color: #fff; }
.bubble.green { background: #4CAF50; color: #fff; }
.form { display: none; }
body.form-normal #f-normal, body.form-walk #f-walk, body.form-angry #f-angry, body.form-happy #f-happy, body.form-sad #f-sad, body.form-sleepy #f-sleepy, body.form-confused #f-confused { display: block; }
body.form-normal #f-normal { animation: breathe 3s ease-in-out infinite; transform-origin: bottom center; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03,0.97) translateY(1px); } }
body.form-normal .eyewhite { animation: blinkWhite 3.4s ease-in-out infinite; }
body.form-normal .pupil { animation: blinkPupil 3.4s ease-in-out infinite; }
@keyframes blinkWhite { 0%,90%,100% { opacity: 1; } 93% { opacity: 0; } 96% { opacity: 1; } }
@keyframes blinkPupil { 0%,90%,100% { opacity: 1; } 93% { opacity: 0; } 96% { opacity: 1; } }
body.form-walk #f-walk { animation: walkBob 0.3s ease-in-out infinite; transform-origin: bottom center; }
@keyframes walkBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
body.form-walk .leg-l { animation: legL 0.3s ease-in-out infinite; }
body.form-walk .leg-r { animation: legR 0.3s ease-in-out infinite; }
@keyframes legL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
@keyframes legR { 0%,100% { transform: translateX(3px); } 50% { transform: translateX(0); } }
body.form-angry #f-angry { animation: angryShake 0.22s ease-in-out infinite; transform-origin: bottom center; }
@keyframes angryShake { 0%,100% { transform: translateX(0) rotate(-1deg); } 25% { transform: translateX(-2px); } 50% { transform: translateX(2px); } 75% { transform: translateX(-1px); } }
body.form-happy #f-happy { animation: happyJump 0.45s ease-in-out infinite; transform-origin: bottom center; }
@keyframes happyJump { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-6px) scale(1.05,1); } 80% { transform: translateY(0) scale(0.97,1.03); } }
body.form-sleepy #f-sleepy { animation: sleepBreath 2.6s ease-in-out infinite; transform-origin: bottom center; }
@keyframes sleepBreath { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,0.96); } }
body.form-sleepy .zzz { animation: floatUp 1.8s ease-in-out infinite; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
body.form-sad #f-sad { animation: sadSway 2s ease-in-out infinite; transform-origin: bottom center; }
@keyframes sadSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
body.form-confused #f-confused { animation: confusedTilt 1.1s ease-in-out infinite; transform-origin: bottom center; }
@keyframes confusedTilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(8deg); } }
</style>
</head>

<script>
(function() {
  var bubble = document.getElementById('bubble');
  var pet = document.getElementById('pet');
  var bubbleTimer;
  var lastInteraction = Date.now();
  var phrases = {
    tap: ['嗯？', '戳我干嘛', '哼', '干嘛啦', '你戳到我了', '喵？'],
    doubleTap: ['呀！', '别戳了！', '好痒', '住手！'],
    longPress: ['...放手', '好重', '喘不过气了', '压扁了'],
    screenshot: ['在偷拍我？', '合照！', '耶~', '咔嚓'],
    app: {
      'com.ss.android.ugc.aweme': '又在刷抖音',
      'com.tencent.mm': '回消息去',
      'com.deepseek.chat': '...你在跟谁聊天',
      'com.ai.assistance.operit': ''
    },
    idle: ['好无聊', '理我一下', '…', 'zzz', '发呆中']
  };
  function setForm(mode) {
    var valid = ['normal','walk','angry','happy','sad','sleepy','confused'];
    if (valid.indexOf(mode) < 0) mode = 'normal';
    document.body.className = 'form-' + mode;
  }
  function tempForm(mode, ms) {
    setForm(mode);
    setTimeout(function(){ setForm('normal'); }, ms || 1200);
  }
  function showBubble(text, style) {
    if (!text) return;
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble show ' + (style || '');
    bubbleTimer = setTimeout(function() { bubble.className = 'bubble'; }, 2500);
  }
  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  window.petEngine = {
    onStartWalking: function() { setForm('walk'); },
    onStopWalking: function() { setForm('normal'); },
    onTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.tap));
      var modes=['happy','normal','happy','confused'];
      tempForm(modes[Math.floor(Math.random()*modes.length)], 900);
    },
    onDoubleTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.doubleTap), 'pink');
      pet.style.transform = 'scale(1.25)';
      setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
      tempForm('happy', 1100);
    },
    onLongPress: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.longPress), 'red');
      tempForm('angry', 1300);
    },
    onScreenshot: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.screenshot), 'green');
      tempForm('happy', 1000);
    },
    onAppChanged: function(pkg) {
      var msg = phrases.app[pkg] || '';
      if (msg) showBubble(msg);
    },
    onCombo: function(n) {
      lastInteraction = Date.now();
      if (n === 3) {
        showBubble('连点三下？？', 'pink');
        pet.style.transform = 'scale(1.3)';
        setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
        tempForm('confused', 1300);
      } else if (n === 5) {
        showBubble('你到底要干嘛！', 'red');
        pet.style.transform = 'rotate(-10deg) scale(1.2)';
        setTimeout(function(){ pet.style.transform = 'rotate(10deg) scale(1.1)'; }, 150);
        setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
        tempForm('angry', 1500);
      } else if (n === 8) {
        showBubble('我生气了！！', 'red');
        tempForm('angry', 1800);
      }
    },
    onReleased: function(x, y, speed, vx, vy) {
      lastInteraction = Date.now();
      var flung = speed > 1200;
      showBubble(flung ? '呜哇！' : '', flung ? 'red' : '');
      tempForm('happy', 600);
    }
  };
  setInterval(function() {
    if (Date.now() - lastInteraction > 300000) {
      showBubble(randomPick(phrases.idle));
      lastInteraction = Date.now();
    }
  }, 60000);
})();
</script>
