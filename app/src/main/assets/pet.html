<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
.pet { position: relative; user-select: none; transform-origin: center; }
.pet svg { display: block; }
.bubble { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 12px; padding: 4px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 999; }
.bubble.show { opacity: 1; }
.bubble.pink { background: #ff69b4; color: #fff; }
.bubble.red { background: #ff4444; color: #fff; }
.bubble.green { background: #4CAF50; color: #fff; }
.form { display: none; }
body.form-normal #f-normal, body.form-walk #f-walk, body.form-angry #f-angry, body.form-happy #f-happy, body.form-sad #f-sad, body.form-sleepy #f-sleepy, body.form-confused #f-confused { display: block; }
/* normal 呼吸 */
body.form-normal #f-normal { animation: breathe 3s ease-in-out infinite; transform-origin: center; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02,0.975) translateY(1px); } }
body.form-normal .eyeL .eyewhite, body.form-normal .eyeR .eyewhite { animation: blinkW 3.2s ease-in-out infinite; }
body.form-normal .eyeL .pupil, body.form-normal .eyeR .pupil { animation: blinkP 3.2s ease-in-out infinite; }
@keyframes blinkW { 0%,90%,100% { opacity:1; } 93% { opacity:0; } 96% { opacity:1; } }
@keyframes blinkP { 0%,90%,100% { opacity:1; } 93% { opacity:0; } 96% { opacity:1; } }
/* walk 走路（腿圆点点 + 身体轻微上下颠） */
body.form-walk #f-walk { animation: walkBob 0.22s ease-in-out infinite; transform-origin: center; }
@keyframes walkBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
body.form-walk .leg-l { animation: legL 0.22s linear infinite; }
body.form-walk .leg-r { animation: legR 0.22s linear infinite; }
@keyframes legL { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
@keyframes legR { 0%,100% { transform: translateX(3px); } 50% { transform: translateX(0); } }
/* angry 蹦跳（生气但可爱：三连跳 + 抖） */
body.form-angry #f-angry { animation: angryJump 0.5s ease-in-out infinite; transform-origin: center; }
@keyframes angryJump {
  0% { transform: translateY(0); }
  30% { transform: translateY(-14px) rotate(-6deg); }
  60% { transform: translateY(0) rotate(6deg); }
  80% { transform: translateY(-9px); }
  100% { transform: translateY(0); }
}
/* happy 开心（笑眼 >< + 横D嘴） */
body.form-happy #f-happy { animation: happyJump 0.45s ease-in-out infinite; transform-origin: center; }
@keyframes happyJump { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-7px) scale(1.04,0.97); } 80% { transform: translateY(0) scale(0.97,1.03); } }
/* sleepy 睡觉 */
body.form-sleepy #f-sleepy { animation: sleepBreath 2.6s ease-in-out infinite; transform-origin: center; }
@keyframes sleepBreath { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,0.97); } }
body.form-sleepy .zzz { animation: floatUp 1.8s ease-in-out infinite; }
@keyframes floatUp { 0% { opacity:0; transform: translateY(0); } 20% { opacity:1; } 100% { opacity:0; transform: translateY(-24px); } }
/* sad 难过（垂下耳朵） */
body.form-sad #f-sad { animation: sadSway 2s ease-in-out infinite; transform-origin: center; }
@keyframes sadSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
/* confused 困惑（歪头抖） */
body.form-confused #f-confused { animation: confusedTilt 1.1s ease-in-out infinite; transform-origin: center; }
@keyframes confusedTilt { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(8deg); } }
</style>
</head>

  <g class="eyeL"><rect class="eyewhite" x="-2.0" y="-1" width="3" height="3" fill="#fff"/><rect class="pupil" x="-1.2" y="-0.2" width="1.2" height="1.2" fill="#333"/></g>
  <g class="eyeR"><rect class="eyewhite" x="4.0" y="-1" width="3" height="3" fill="#fff"/><rect class="pupil" x="4.8" y="-0.2" width="1.2" height="1.2" fill="#333"/></g>
  <line x1="-0.2" y1="1.6" x2="0.8" y2="1.6" stroke="#ff8fb3" stroke-width="0.32" stroke-linecap="round"/>
  <circle class="leg-l" cx="-2.0" cy="11.6" r="0.7" fill="#000"/>
  <circle class="leg-r" cx="3.2" cy="11.6" r="0.7" fill="#000"/>
</g>
</svg>
</div>
<script>
(function() {
  var bubble = document.getElementById('bubble');
  var pet = document.getElementById('pet');
  var bubbleTimer;
  var lastInteraction = Date.now();
  var phrases = {
    tap: ['嗯？','戳我干嘛','哼','干嘛啦','喵？','痒~'],
    doubleTap: ['呀！','别戳了！','好痒','住手！'],
    longPress: ['...放手','好重','压扁了','喘不过气了'],
    screenshot: ['在偷拍我？','合照！','耶~','咔嚓'],
    app: {
      'com.ss.android.ugc.aweme': '又在刷抖音',
      'com.tencent.mm': '回消息去',
      'com.deepseek.chat': '...你在跟谁聊天',
      'com.ai.assistance.operit': ''
    },
    idle: ['好无聊','理我一下','…','zzz','发呆中']
  };
  function setForm(mode) {
    var valid = ['normal','walk','angry','happy','sad','sleepy','confused'];
    if (valid.indexOf(mode) < 0) mode = 'normal';
    document.body.className = 'form-' + mode;
  }
  function tempForm(mode, ms) {
    setForm(mode);
    setTimeout(function(){ setForm('normal'); }, ms || 1200);
  }
  function showBubble(text, style) {
    if (!text) return;
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble show ' + (style || '');
    bubbleTimer = setTimeout(function() { bubble.className = 'bubble'; }, 2500);
  }
  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  window.petEngine = {
    onStartWalking: function() { setForm('walk'); },
    onStopWalking: function() { setForm('normal'); },
    // 走回屏幕中间后：蹦跳两三下 + 生气但可爱的表情
    onReturnedHome: function() {
      setForm('angry');
      showBubble('哼！别把我甩那么远', 'red');
      pet.style.transform = 'translateY(0)';
      var i = 0;
      var hop = setInterval(function() {
        i++;
        pet.style.transform = 'translateY(-18px) rotate(' + (i % 2 ? -8 : 8) + 'deg)';
        setTimeout(function() { pet.style.transform = 'translateY(0)'; }, 120);
        if (i >= 4) { clearInterval(hop); pet.style.transform = ''; setForm('normal'); }
      }, 180);
    },
    onTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.tap));
      var modes=['happy','normal','happy','confused'];
      tempForm(modes[Math.floor(Math.random()*modes.length)], 900);
    },
    onDoubleTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.doubleTap), 'pink');
      pet.style.transform = 'scale(1.25)';
      setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
      tempForm('happy', 1100);
    },
    onLongPress: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.longPress), 'red');
      tempForm('angry', 1300);
    },
    onScreenshot: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.screenshot), 'green');
      tempForm('happy', 1000);
    },
    onAppChanged: function(pkg) {
      var msg = phrases.app[pkg] || '';
      if (msg) showBubble(msg);
    },
    onCombo: function(n) {
      lastInteraction = Date.now();
      if (n === 3) {
        showBubble('连点三下？？', 'pink');
        pet.style.transform = 'scale(1.3)';
        setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
        tempForm('confused', 1300);
      } else if (n === 5) {
        showBubble('你到底要干嘛！', 'red');
        pet.style.transform = 'rotate(-10deg) scale(1.2)';
        setTimeout(function(){ pet.style.transform = 'rotate(10deg) scale(1.1)'; }, 150);
        setTimeout(function(){ pet.style.transform = 'scale(1)'; }, 300);
        tempForm('angry', 1500);
      } else if (n === 8) {
        showBubble('我生气了！！', 'red');
        tempForm('angry', 1800);
      }
    },
    onReleased: function(x, y, speed, vx, vy) {
      lastInteraction = Date.now();
      var flung = speed > 1200;
      showBubble(flung ? '呜哇！' : '', flung ? 'red' : '');
      tempForm('happy', 600);
    }
  };
  setInterval(function() {
    if (Date.now() - lastInteraction > 300000) {
      showBubble(randomPick(phrases.idle));
      lastInteraction = Date.now();
    }
  }, 60000);
})();
</script>
</body>
</html>
