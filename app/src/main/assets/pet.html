<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  width: 100vw; height: 100vh; overflow: hidden;
  font-family: sans-serif;
}
.pet {
  width: 45px; height: 45px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease;
  user-select: none;
}
.pet svg { width: 100%; height: 100%; }
.bubble {
  position: absolute; top: -38px; left: 50%;
  transform: translateX(-50%);
  background: #fff; border-radius: 12px;
  padding: 4px 10px; font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.bubble.show { opacity: 1; }
.bubble.pink { background: #ff69b4; color: #fff; }
.bubble.red { background: #ff4444; color: #fff; }
.bubble.green { background: #4CAF50; color: #fff; }
/* ===== pet idle animations ===== */
.pet { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03,0.98); }
}
/* ===== cat angry feedback ===== */
.pet.cat-angry .eye-left rect,
.pet.cat-angry .eye-right rect { animation: none; }
.pet.cat-angry { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-3px); }
}
</style>
</head>
<body>
<div class="bubble" id="bubble"></div>
<div class="pet" id="pet">
  <svg id="petsvg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <rect x="18" y="12" width="22" height="22" fill="#000000"/>
    <rect x="22" y="16" width="14" height="14" fill="#FFFFFF"/>
    <rect x="80" y="12" width="22" height="22" fill="#000000"/>
    <rect x="84" y="16" width="14" height="14" fill="#FFFFFF"/>
    <rect x="12" y="28" width="96" height="82" fill="#000000"/>
    <rect x="16" y="32" width="88" height="74" fill="#111111"/>
    <rect x="20" y="44" width="34" height="30" fill="#000000"/>
    <rect x="66" y="44" width="34" height="30" fill="#000000"/>
    <rect id="lidLeft" x="20" y="44" width="34" height="0" fill="#000000"/>
    <rect id="lidRight" x="66" y="44" width="34" height="0" fill="#000000"/>
    <g class="eye-left">
      <rect x="26" y="46" width="26" height="22" fill="#FFFFFF"/>
      <rect x="28" y="46" width="4" height="22" fill="#F5F5F5"/>
      <rect x="38" y="46" width="8" height="22" fill="#FFFFFF"/>
      <rect x="36" y="46" width="3" height="22" fill="#000000"/>
    </g>
    <g class="eye-right">
      <rect x="68" y="46" width="26" height="22" fill="#FFFFFF"/>
      <rect x="70" y="46" width="4" height="22" fill="#F5F5F5"/>
      <rect x="80" y="46" width="8" height="22" fill="#FFFFFF"/>
      <rect x="78" y="46" width="3" height="22" fill="#000000"/>
    </g>
    <rect x="54" y="76" width="12" height="8" fill="#3a2a3a"/>
    <rect x="16" y="68" width="14" height="2" fill="#222222"/>
    <rect x="16" y="74" width="12" height="2" fill="#222222"/>
    <rect x="90" y="68" width="14" height="2" fill="#222222"/>
    <rect x="92" y="74" width="12" height="2" fill="#222222"/>
    <style>
      @keyframes blinkL { 0%,92%,100%{height:0} 94%{height:22} 97%{height:0} }
      @keyframes blinkR { 0%,92%,100%{height:0} 94%{height:22} 97%{height:0} }
      #lidLeft { animation: blinkL 3s infinite; }
      #lidRight { animation: blinkR 3s infinite; }
    </style>
  </svg>
</div>
<script>

  var bubble = document.getElementById('bubble');

  }
  scheduleBlink();

  var pet = document.getElementById('pet');
  var mouth = document.getElementById('mouth');
  var bubbleTimer;
  var lastInteraction = Date.now();
  var phrases = {
    tap: ['嗯？', '戳我干嘛', '哼', '干嘛啦', '你戳到我了', '嗷'],
    doubleTap: ['呀！', '别戳了！', '好痒', '住手！', '啊啊啊'],
    longPress: ['...放手', '好重', '喘不过气了', '压扁了'],
    screenshot: ['在偷拍我？', '合照！', '耶~', '咔嚓', '我上镜吗'],
    app: {
      'com.ss.android.ugc.aweme': '又在刷抖音',
      'com.tencent.mm': '回消息去',
      'com.deepseek.chat': '...你在跟谁聊天',
      'com.ai.assistance.operit': '❤'
    },
    idle: ['好无聊', '理我一下', '…', 'zzz', '发呆中']
  };

  function showBubble(text, style) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble show ' + (style || '');
    bubbleTimer = setTimeout(function() { bubble.className = 'bubble'; }, 2500);
  }

  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shakePet() {
    pet.style.transform = 'rotate(-8deg)';
    setTimeout(function() { pet.style.transform = 'rotate(8deg)'; }, 100);
    setTimeout(function() { pet.style.transform = 'rotate(0deg)'; }, 200);
  }

  window.petEngine = {
    onTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.tap));
      shakePet();
    },
    onDoubleTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.doubleTap), 'pink');
      pet.style.transform = 'scale(1.25)';
      setTimeout(function() { pet.style.transform = 'scale(1)'; }, 300);
    },
    onLongPress: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.longPress), 'red');
    },
    onScreenshot: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.screenshot), 'green');
    },
    onAppChanged: function(pkg) {
      var msg = phrases.app[pkg] || '';
      if (msg) showBubble(msg);
    }
  };
  setInterval(function() {
    if (Date.now() - lastInteraction > 300000) {
      showBubble(randomPick(phrases.idle));
      lastInteraction = Date.now();
    }
  }, 60000);

  // ===== angry / shake feedback =====
  function fanTail() {
    pet.classList.add('cat-angry');
    showBubble('气死我了', 'red');
    setTimeout(function() { pet.classList.remove('cat-angry'); }, 1500);
  }


  // poll supabase for state changes
  var SUPABASE_URL = 'https://your-project.supabase.co';
  var SUPABASE_KEY = 'your-anon-key';
  setInterval(function() {
    if (SUPABASE_URL === 'https://your-project.supabase.co') return;
    fetch(SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=1', {
      headers: { 'apikey': SUPABASE_KEY }
    }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var state = data[0];
        if (state.state_key === 'speech') {
          showBubble(state.state_value);
        }
      }
    }).catch(function() {});
  }, 30000);
})();
</script>
</body>
</html>
