<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  width: 100vw; height: 100vh; overflow: hidden;
  font-family: sans-serif;
}
.pet {
  width: 130px; height: 130px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease;
  user-select: none;
}
.pet svg { width: 100%; height: 100%; }
.bubble {
  position: absolute; top: -38px; left: 50%;
  transform: translateX(-50%);
  background: #fff; border-radius: 12px;
  padding: 4px 10px; font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.bubble.show { opacity: 1; }
.bubble.pink { background: #ff69b4; color: #fff; }
.bubble.red { background: #ff4444; color: #fff; }
.bubble.green { background: #4CAF50; color: #fff; }
/* ===== crow idle animations ===== */
.pet { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03,0.98); }
}
.tail { transform-origin: 30% 40%; animation: tailsway 4s ease-in-out infinite; }
@keyframes tailsway {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(-6deg); }
}
.wing { transform-origin: 80% 70%; animation: wingflap 2.4s ease-in-out infinite; }
@keyframes wingflap {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(-10deg); }
}
.pet.tail-fanned .tail { animation: talfan 0.5s ease-out forwards; }
@keyframes talfan {
  from { transform: rotate(0deg); }
  to { transform: rotate(-14deg) scaleY(1.4); }
}
.pet.tail-fanned .tail rect { fill: #6a5acd; }
.pet.tail-fanned .tail rect:nth-child(odd) { fill: #4a4a8a; }
</style>
</head>
<body>
<div class="bubble" id="bubble"></div>
<div class="pet" id="pet">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <!-- tail -->
    <g class="tail">
      <rect x="14" y="52" width="10" height="4" fill="#2a2a3a"/>
      <rect x="12" y="60" width="12" height="4" fill="#221f3f"/>
      <rect x="16" y="68" width="10" height="4" fill="#1d1b36"/>
      <rect x="18" y="76" width="8" height="4" fill="#2a2a3a"/>
      <rect x="22" y="84" width="6" height="4" fill="#1d1b36"/>
    </g>
    <!-- body -->
    <rect x="34" y="58" width="52" height="44" rx="6" fill="#1a1a24"/>
    <rect x="40" y="56" width="40" height="6" fill="#4a4a8a"/>
    <rect x="46" y="54" width="28" height="4" fill="#6a5acd"/>
    <!-- wing -->
    <g class="wing">
      <rect x="68" y="64" width="22" height="26" fill="#12121c"/>
      <rect x="72" y="66" width="16" height="4" fill="#3a3a6a"/>
      <rect x="74" y="72" width="14" height="4" fill="#2a2a4a"/>
      <rect x="76" y="78" width="12" height="4" fill="#22223c"/>
    </g>
    <!-- chest -->
    <rect x="36" y="92" width="46" height="10" rx="4" fill="#242440"/>
    <!-- head -->
    <rect x="44" y="16" width="40" height="40" rx="8" fill="#1a1a24"/>
    <rect x="48" y="12" width="30" height="6" fill="#6a5acd"/>
    <!-- eyes -->
    <g class="eye">
      <rect x="52" y="30" width="6" height="8" fill="#e6a915"/>
      <rect x="55" y="32" width="3" height="4" fill="#1a1a24"/>
    </g>
    <g class="eye">
      <rect x="66" y="30" width="6" height="8" fill="#e6a915"/>
      <rect x="69" y="32" width="3" height="4" fill="#1a1a24"/>
    </g>
    <!-- beak -->
    <rect x="58" y="40" width="12" height="6" rx="2" fill="#d8850f"/>
    <!-- blink overlay -->
    <rect class="blink" x="50" y="30" width="26" height="8" fill="#1a1a24" opacity="0"/>
  </svg>
</div>
<script>
(function() {
  var bubble = document.getElementById('bubble');
  var pet = document.getElementById('pet');
  var mouth = document.getElementById('mouth');
  var bubbleTimer;
  var lastInteraction = Date.now();
  var phrases = {
    tap: ['嗯？', '戳我干嘛', '哼', '干嘛啦', '你戳到我了', '嗷'],
    doubleTap: ['呀！', '别戳了！', '好痒', '住手！', '啊啊啊'],
    longPress: ['...放手', '好重', '喘不过气了', '压扁了'],
    screenshot: ['在偷拍我？', '合照！', '耶~', '咔嚓', '我上镜吗'],
    app: {
      'com.ss.android.ugc.aweme': '又在刷抖音',
      'com.tencent.mm': '回消息去',
      'com.deepseek.chat': '...你在跟谁聊天',
      'com.ai.assistance.operit': '❤'
    },
    idle: ['好无聊', '理我一下', '…', 'zzz', '发呆中']
  };

  function showBubble(text, style) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble show ' + (style || '');
    bubbleTimer = setTimeout(function() { bubble.className = 'bubble'; }, 2500);
  }

  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shakePet() {
    pet.style.transform = 'rotate(-8deg)';
    setTimeout(function() { pet.style.transform = 'rotate(8deg)'; }, 100);
    setTimeout(function() { pet.style.transform = 'rotate(0deg)'; }, 200);
  }

  window.petEngine = {
    onTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.tap));
      shakePet();
    },
    onDoubleTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.doubleTap), 'pink');
      pet.style.transform = 'scale(1.25)';
      setTimeout(function() { pet.style.transform = 'scale(1)'; }, 300);
    },
    onLongPress: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.longPress), 'red');
    },
    onScreenshot: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.screenshot), 'green');
    },
    onAppChanged: function(pkg) {
      var msg = phrases.app[pkg] || '';
      if (msg) showBubble(msg);
    }
  };
  setInterval(function() {
    if (Date.now() - lastInteraction > 300000) {
      showBubble(randomPick(phrases.idle));
      lastInteraction = Date.now();
    }
  }, 60000);

  // ===== blink animation =====
  var blink = document.querySelector('.blink');
  setInterval(function() { blink.setAttribute('opacity', '1'); }, 3800);
  setInterval(function() { blink.setAttribute('opacity', '0'); }, 3950);

  // ===== angry / tail-fan feedback =====
  function fanTail() {
    pet.classList.add('tail-fanned');
    showBubble('气死我了', 'red');
    setTimeout(function() { pet.classList.remove('tail-fanned'); }, 1500);
  }


  // poll supabase for state changes
  var SUPABASE_URL = 'https://your-project.supabase.co';
  var SUPABASE_KEY = 'your-anon-key';
  setInterval(function() {
    if (SUPABASE_URL === 'https://your-project.supabase.co') return;
    fetch(SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=1', {
      headers: { 'apikey': SUPABASE_KEY }
    }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var state = data[0];
        if (state.state_key === 'speech') {
          showBubble(state.state_value);
        }
      }
    }).catch(function() {});
  }, 30000);
})();
</script>
</body>
</html>
