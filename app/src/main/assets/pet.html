<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  width: 100vw; height: 100vh; overflow: hidden;
  font-family: sans-serif;
}
.pet {
  width: 45px; height: 45px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease;
  user-select: none;
}
.pet svg { width: 100%; height: 100%; }
.bubble {
  position: absolute; top: -38px; left: 50%;
  transform: translateX(-50%);
  background: #fff; border-radius: 12px;
  padding: 4px 10px; font-size: 13px;
  white-space: nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.bubble.show { opacity: 1; }
.bubble.pink { background: #ff69b4; color: #fff; }
.bubble.red { background: #ff4444; color: #fff; }
.bubble.green { background: #4CAF50; color: #fff; }
/* ===== pet idle animations ===== */
.pet { animation: breathe 3s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03,0.98); }
}
/* ===== cat angry feedback ===== */
.pet.cat-angry #lid-left,
.pet.cat-angry #lid-right { animation: none; height: 0; }
.pet.cat-angry #eye-left .lid,
.pet.cat-angry #eye-right .lid { animation: none; }
.pet.cat-angry { animation: shake 0.4s ease-in-out; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-3px); }
}
</style>
</head>
<body>
<div class="bubble" id="bubble"></div>
<div class="pet" id="pet">
    <svg id="petsvg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <g id="ear-left" class="ear">
      <path d="M20 40 L16 10 L42 30 Z" fill="#000000"/>
      <path d="M24 34 L22 16 L37 29 Z" fill="#1a1a1a"/>
    </g>
    <g id="ear-right" class="ear">
      <path d="M100 40 L104 10 L78 30 Z" fill="#000000"/>
      <path d="M96 34 L98 16 L83 29 Z" fill="#1a1a1a"/>
    </g>
    <ellipse id="face" cx="60" cy="70" rx="48" ry="42" fill="#000000"/>
    <g id="eye-left" class="eye">
      <ellipse cx="42" cy="64" rx="12" ry="14" fill="#FFFFFF"/>
      <ellipse id="pupil-left" cx="42" cy="68" rx="5" ry="7" fill="#000000"/>
      <rect id="lid-left" class="lid" x="30" y="52" width="24" height="0" fill="#000000"/>
    </g>
    <g id="eye-right" class="eye">
      <ellipse cx="78" cy="64" rx="12" ry="14" fill="#FFFFFF"/>
      <ellipse id="pupil-right" cx="78" cy="68" rx="5" ry="7" fill="#000000"/>
      <rect id="lid-right" class="lid" x="66" y="52" width="24" height="0" fill="#000000"/>
    </g>
    <ellipse id="nose" cx="60" cy="86" rx="4" ry="3" fill="#ff69b4"/>
    <g id="mouth" class="mouth">
      <path d="M60 89 Q60 96 66 94" stroke="#ff69b4" fill="none" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 89 Q60 96 54 94" stroke="#ff69b4" fill="none" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="whisker-left" class="whisker">
      <line x1="14" y1="80" x2="34" y2="84" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <line x1="12" y1="88" x2="32" y2="89" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    </g>
    <g id="whisker-right" class="whisker">
      <line x1="106" y1="80" x2="86" y2="84" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <line x1="108" y1="88" x2="88" y2="89" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    </g>
    <style>
      @keyframes blinkAnim { 0%,90%,100%{height:0} 93%{height:14} 96%{height:0} }
      #lid-left, #lid-right { animation: blinkAnim 3s ease-in-out infinite; }
    </style>
  </svg>
</div>
<script>
(function() {
  var bubble = document.getElementById('bubble');
  var pet = document.getElementById('pet');
  var mouth = document.getElementById('mouth');
  var bubbleTimer;
  var lastInteraction = Date.now();
  var phrases = {
    tap: ['嗯？', '戳我干嘛', '哼', '干嘛啦', '你戳到我了', '嗷'],
    doubleTap: ['呀！', '别戳了！', '好痒', '住手！', '啊啊啊'],
    longPress: ['...放手', '好重', '喘不过气了', '压扁了'],
    screenshot: ['在偷拍我？', '合照！', '耶~', '咔嚓', '我上镜吗'],
    app: {
      'com.ss.android.ugc.aweme': '又在刷抖音',
      'com.tencent.mm': '回消息去',
      'com.deepseek.chat': '...你在跟谁聊天',
      'com.ai.assistance.operit': '❤'
    },
    idle: ['好无聊', '理我一下', '…', 'zzz', '发呆中']
  };

  function showBubble(text, style) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.className = 'bubble show ' + (style || '');
    bubbleTimer = setTimeout(function() { bubble.className = 'bubble'; }, 2500);
  }

  function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function shakePet() {
    pet.style.transform = 'rotate(-8deg)';
    setTimeout(function() { pet.style.transform = 'rotate(8deg)'; }, 100);
    setTimeout(function() { pet.style.transform = 'rotate(0deg)'; }, 200);
  }

  // ===== 表情系统：能精确操控五官 =====
  function $(id){ return document.getElementById(id); }
  function setFace(mode) {
    var P = {
      'happy': {pe:'#000000', px:48, py:66, mout:'M60 89 Q60 100 68 96', lid:0, ear:'rotate(8 30 30)'},
      'sad':   {pe:'#000000', px:42, py:70, mout:'M60 89 Q60 84 66 86', lid:0, ear:'rotate(-8 30 30)'},
      'angry': {pe:'#000000', px:42, py:66, mout:'M60 89 Q60 96 66 94', lid:0, ear:'normal'},
      'confused':{pe:'#000000', px:44, py:68, mout:'M52 94 Q60 94 68 94', lid:0, ear:'normal'},
      'sleepy': {pe:'#000000', px:42, py:66, mout:'M60 89 Q60 96 66 94', lid:12, ear:'normal'},
      'normal': {pe:'#000000', px:42, py:68, mout:'M60 89 Q60 96 66 94', lid:0, ear:'normal'}
    };
    var f = P[mode] || P['normal'];
    var lx = $('pupil-left'), rx = $('pupil-right');
    var ml = $('lid-left'), mr = $('lid-right');
    var mt = $('mouth');
    var el = $('ear-left'), er = $('ear-right');
    // 瞳孔移动（center 42/68）
    if (lx){ lx.setAttribute('cx', f.px); lx.setAttribute('cy', f.py); }
    if (rx){ rx.setAttribute('cx', 120-f.px); rx.setAttribute('cy', f.py); }
    // 眼皮高度（0=睁开）
    if (ml){ ml.setAttribute('height', f.lid); }
    if (mr){ mr.setAttribute('height', f.lid); }
    // 嘴形
    if (mt){
      var paths = mt.querySelectorAll('path');
      var d = f.mout;
      paths[0] && paths[0].setAttribute('d', d);
      if (paths[1]) paths[1].setAttribute('d', d);
    }
    // 耳朵旋转（立/塌）
    if (el && er){
      var lr = (f.ear==='rotate(8 30 30)') ? 'rotate(8 30 30)' : (f.ear==='rotate(-8 30 30)') ? 'rotate(-8 30 30)' : '';
      var rr = (f.ear==='rotate(8 30 30)') ? 'rotate(-8 90 30)' : (f.ear==='rotate(-8 30 30)') ? 'rotate(8 90 30)' : '';
      el.setAttribute('transform', lr);
      er.setAttribute('transform', rr);
    }
    // 生气时竖起耳朵（可选：用耳尖角度体现）
    if (mode==='angry'){ $('face') && $('face').setAttribute('fill','#2a2a2a'); }
    else if (mode==='happy'){ $('face') && $('face').setAttribute('fill','#000000'); }
  }
  function tempFace(mode, ms){
    setFace(mode);
    setTimeout(function(){ setFace('normal'); }, ms || 1200);
  }

  window.petEngine = {
    onTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.tap));
      shakePet();
      var modes=['happy','normal','happy','confused'];
      tempFace(modes[Math.floor(Math.random()*modes.length)], 900);
    },
    onDoubleTap: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.doubleTap), 'pink');
      pet.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration:300});
      tempFace('happy', 1100);
    },
    onLongPress: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.longPress), 'red');
      tempFace('angry', 1300);
    },
    onScreenshot: function() {
      lastInteraction = Date.now();
      showBubble(randomPick(phrases.screenshot), 'green');
      tempFace('happy', 1000);
    },
    onAppChanged: function(pkg) {
      var msg = phrases.app[pkg] || '';
      if (msg) showBubble(msg);
    },
    // 连击递进：第 3/5/8 次
    onCombo: function(n) {
      lastInteraction = Date.now();
      pet.classList.remove('cat-angry');
      if (n === 3) {
        showBubble('连点三下？？', 'pink');
        pet.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}], {duration:300});
        tempFace('confused', 1300);
      } else if (n === 5) {
        showBubble('你到底要干嘛！', 'red');
        pet.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.2) rotate(-20deg)'},{transform:'scale(1) rotate(3deg)'},{transform:'scale(1)'}], {duration:400});
        tempFace('angry', 1500);
      } else if (n === 8) {
        showBubble('我生气了！！', 'red');
        pet.classList.add('cat-angry');
        tempFace('angry', 1600);
        setTimeout(function(){ pet.classList.remove('cat-angry'); }, 1500);
      }
    },
    // 被拖拽/甩出后爬回
    onReleased: function(x, y, speed, vx, vy) {
      lastInteraction = Date.now();
      var flung = speed > 1200;
      showBubble(flung ? '呜哇！' : '哼，自己会走', flung ? 'red' : 'white');
      var deg = (vx>0?-20:20);
      pet.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1) rotate('+deg+'deg)'},{transform:'scale(1) rotate(0)'}], {duration:500});
      tempFace('happy', 1200);
    }
  };
  setInterval(function() {
    if (Date.now() - lastInteraction > 300000) {
      showBubble(randomPick(phrases.idle));
      lastInteraction = Date.now();
    }
  }, 60000);

  // ===== angry / shake feedback =====
  function fanTail() {
    pet.classList.add('cat-angry');
    showBubble('气死我了', 'red');
    setTimeout(function() { pet.classList.remove('cat-angry'); }, 1500);
  }


  // poll supabase for state changes
  var SUPABASE_URL = 'https://your-project.supabase.co';
  var SUPABASE_KEY = 'your-anon-key';
  setInterval(function() {
    if (SUPABASE_URL === 'https://your-project.supabase.co') return;
    fetch(SUPABASE_URL + '/rest/v1/pet_state?order=updated_at.desc&limit=1', {
      headers: { 'apikey': SUPABASE_KEY }
    }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var state = data[0];
        if (state.state_key === 'speech') {
          showBubble(state.state_value);
        }
      }
    }).catch(function() {});
  }, 30000);
})();
</script>
</body>
</html>
